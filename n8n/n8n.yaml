# n8n — платформа автоматизаций (как Zapier): собираешь сценарии из блоков мышкой.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1                         # несколько копий n8n требуют "queue mode" с Redis, это отдельная тема
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:2.41.5     # ← эту строку будем менять через git
          ports:
            - containerPort: 5678
          env:
            # где хранить данные: Postgres из postgres.yaml
            - { name: DB_TYPE,                value: postgresdb }
            - { name: DB_POSTGRESDB_HOST,     value: postgres }
            - { name: DB_POSTGRESDB_PORT,     value: "5432" }
            - { name: DB_POSTGRESDB_DATABASE, value: n8n }
            - { name: DB_POSTGRESDB_USER,     value: n8n }
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef: { name: n8n-secrets, key: POSTGRES_PASSWORD }
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: n8n-secrets, key: N8N_ENCRYPTION_KEY }
            - { name: GENERIC_TIMEZONE,       value: Europe/Moscow }
            - { name: N8N_SECURE_COOKIE,      value: "false" }   # учебный стенд по http
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }  # не слать телеметрию
          readinessProbe:
            httpGet: { path: /healthz, port: 5678 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 5678 }
            initialDelaySeconds: 60   # первый старт: миграции базы
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector: { app: n8n }
  ports:
    - port: 5678
      targetPort: 5678
