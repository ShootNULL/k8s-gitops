# Рабочие n8n: тот же образ, но запущенный с аргументом "worker".
# Берут задачи из Redis и выполняют сценарии. Масштабируются свободно.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
spec:
  replicas: 2                          # ← вот это теперь можно увеличивать
  selector:
    matchLabels: { app: n8n-worker }
  template:
    metadata:
      labels: { app: n8n-worker }
    spec:
      containers:
        - name: worker
          image: n8nio/n8n:2.41.5        # ВСЕГДА та же версия, что у main
          args: ["worker", "--concurrency=5"]   # до 5 сценариев одновременно на одного рабочего
          env:
            - { name: EXECUTIONS_MODE,      value: queue }
            - { name: QUEUE_BULL_REDIS_HOST, value: redis }
            - { name: QUEUE_BULL_REDIS_PORT, value: "6379" }
            - { name: QUEUE_HEALTH_CHECK_ACTIVE, value: "true" }   # включает /healthz у рабочего
            # база и ключ — те же, что у main
            - { name: DB_TYPE,                value: postgresdb }
            - { name: DB_POSTGRESDB_HOST,     value: postgres }
            - { name: DB_POSTGRESDB_PORT,     value: "5432" }
            - { name: DB_POSTGRESDB_DATABASE, value: n8n }
            - { name: DB_POSTGRESDB_USER,     value: n8n }
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef: { name: n8n-secrets, key: POSTGRES_PASSWORD }
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: n8n-secrets, key: N8N_ENCRYPTION_KEY }
            - { name: GENERIC_TIMEZONE, value: Europe/Moscow }
          livenessProbe:
            httpGet: { path: /healthz, port: 5678 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }
