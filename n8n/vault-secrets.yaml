# Откуда берётся Secret n8n-secrets: из Vault, через External Secrets Operator (ESO).
# Паролей здесь НЕТ — только "где их взять", поэтому файл можно держать в публичном git.
#
#   Vault: secret/n8n  ──(ESO)──►  Kubernetes Secret n8n-secrets  ──►  n8n, Postgres
#
# Vault настраивается в t7-terraform/02b-vault (роль n8n, политика n8n-read),
# значения кладутся руками: vault kv put secret/n8n ... (см. t7-terraform/VAULT.md).

# Учётка, которой ESO представляется Vault'у. Vault пустит только её
# (bound_service_account_names = ["vault-reader"] в 02b-vault).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
---
# SecretStore — "как подключиться к Vault": адрес, путь хранилища, способ входа.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200   # Service Vault (тема 2: DNS)
      path: secret                                        # KV-хранилище из 02b-vault
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes       # vault_auth_backend "kubernetes"
          role: n8n                   # vault_kubernetes_auth_backend_role "n8n"
          serviceAccountRef:
            name: vault-reader
---
# ExternalSecret — "какие ключи взять и в какой Secret положить".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
spec:
  refreshInterval: 1h                 # раз в час сверять с Vault (поменял пароль в Vault → Secret обновится)
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: n8n-secrets                 # то самое имя, которое ждут n8n.yaml и postgres.yaml
    creationPolicy: Owner             # Secret принадлежит ExternalSecret: удалишь его → удалится и Secret
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: n8n                      # secret/n8n в Vault
        property: POSTGRES_PASSWORD
        # значения по умолчанию прописаны явно, иначе ArgoCD видит разницу и показывает OutOfSync
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: n8n
        property: N8N_ENCRYPTION_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
